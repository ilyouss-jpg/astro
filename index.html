<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Astro</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(160deg, #1e1e2e 0%, #11111b 100%);
    color: #cdd6f4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  header {
    padding: 18px 16px 14px;
    text-align: center;
    background: #181825;
    border-bottom: 1px solid #313244;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    background: linear-gradient(90deg, #89b4fa, #cba6f7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .status {
    font-size: 12px;
    color: #a6adc8;
    margin-top: 4px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.4;
    animation: pop .18s ease;
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .msg.user {
    align-self: flex-end;
    background: #89b4fa;
    color: #1e1e2e;
    border-bottom-right-radius: 4px;
  }
  .msg.astro {
    align-self: flex-start;
    background: #313244;
    color: #cdd6f4;
    border-bottom-left-radius: 4px;
  }
  .msg.astro b, .msg.user b { display:block; font-size: 11px; opacity:.7; margin-bottom:2px; }
  footer {
    padding: 14px 16px 22px;
    background: #181825;
    border-top: 1px solid #313244;
  }
  .controls-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .small-btn {
    flex: 1;
    background: #313244;
    color: #cdd6f4;
    border: none;
    border-radius: 10px;
    padding: 10px 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .small-btn:active { background: #45475a; }
  #micBtn {
    width: 100%;
    border: none;
    border-radius: 20px;
    padding: 18px;
    font-size: 16px;
    font-weight: 700;
    background: #89b4fa;
    color: #1e1e2e;
    cursor: pointer;
    transition: background .15s, transform .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #micBtn.listening {
    background: #f38ba8;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(243,139,168,.5); }
    70% { box-shadow: 0 0 0 16px rgba(243,139,168,0); }
    100% { box-shadow: 0 0 0 0 rgba(243,139,168,0); }
  }
  #micBtn:active { transform: scale(.97); }
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    align-items: center; justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #1e1e2e;
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 340px;
  }
  .modal h2 { margin-top:0; font-size: 17px; }
  .modal p { font-size: 13px; color: #a6adc8; line-height:1.5; }
  .modal input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #313244;
    background: #313244;
    color: #cdd6f4;
    font-size: 14px;
    margin: 10px 0;
  }
  .modal-actions { display:flex; gap:8px; margin-top:8px; }
  .modal-actions button {
    flex:1; padding: 10px; border:none; border-radius: 10px; font-size:14px; cursor:pointer;
  }
  .btn-primary { background:#a6e3a1; color:#1e1e2e; font-weight:600; }
  .btn-secondary { background:#313244; color:#cdd6f4; }
  a { color: #89b4fa; }
</style>
</head>
<body>

<header>
  <h1>🤖 Astro</h1>
  <div class="status" id="statusText">Appuie sur le micro pour me parler</div>
</header>

<div id="chat"></div>

<footer>
  <div class="controls-row">
    <button class="small-btn" onclick="openConfig()">⚙️ API</button>
    <button class="small-btn" onclick="toggleVoice()" id="voiceBtn">🔊 Voix ON</button>
    <button class="small-btn" onclick="clearChat()">🗑️ Effacer</button>
  </div>
  <button id="micBtn">🎤 Appuyer pour parler</button>
</footer>

<div class="modal-bg" id="configModal">
  <div class="modal">
    <h2>⚙️ Configuration</h2>
    <p>Entre ta clé API Groq (gratuite).<br>
    1. Va sur <a href="https://console.groq.com" target="_blank">console.groq.com</a><br>
    2. Crée un compte<br>
    3. API Keys → Create<br>
    4. Colle la clé ici</p>
    <input type="password" id="apiInput" placeholder="gsk_...">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeConfig()">Annuler</button>
      <button class="btn-primary" onclick="saveApiKey()">Sauvegarder</button>
    </div>
  </div>
</div>

<script>
let apiKey = "";
let voiceEnabled = true;
let isListening = false;
let history = [];
let recognition = null;

const chat = document.getElementById('chat');
const micBtn = document.getElementById('micBtn');
const statusText = document.getElementById('statusText');

// --- Charger la clé API sauvegardée ---
async function loadApiKey() {
  try {
    const res = await window.storage.get('astro-api-key', false);
    if (res && res.value) {
      apiKey = res.value;
      statusText.textContent = "✅ API chargée — prêt à parler !";
    }
  } catch (e) {
    // pas encore de clé sauvegardée
  }
}
loadApiKey();

function openConfig() {
  document.getElementById('configModal').classList.add('show');
  document.getElementById('apiInput').value = apiKey;
}
function closeConfig() {
  document.getElementById('configModal').classList.remove('show');
}
async function saveApiKey() {
  const val = document.getElementById('apiInput').value.trim();
  if (!val) return;
  apiKey = val;
  try {
    await window.storage.set('astro-api-key', val, false);
  } catch (e) {
    console.error('Erreur sauvegarde clé', e);
  }
  closeConfig();
  statusText.textContent = "✅ Clé API sauvegardée !";
  addMessage('astro', "Clé API enregistrée, je suis prêt ! 🎉");
}

function addMessage(who, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const label = who === 'user' ? 'Vous' : 'Astro';
  div.innerHTML = `<b>${label}</b>${text}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function clearChat() {
  chat.innerHTML = '';
  history = [];
  addMessage('astro', "Conversation effacée. On recommence ! 👋");
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  document.getElementById('voiceBtn').textContent = voiceEnabled ? "🔊 Voix ON" : "🔇 Voix OFF";
  if (!voiceEnabled) window.speechSynthesis.cancel();
}

// --- Reconnaissance vocale (Web Speech API) ---
function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    statusText.textContent = "⚠️ Micro non supporté par ce navigateur (essaie Chrome)";
    return null;
  }
  const r = new SR();
  r.lang = 'fr-FR';
  r.continuous = false;
  r.interimResults = false;

  r.onstart = () => {
    isListening = true;
    micBtn.classList.add('listening');
    micBtn.textContent = "🔴 J'écoute...";
    statusText.textContent = "🎤 Parle maintenant";
  };

  r.onresult = (event) => {
    const text = event.results[0][0].transcript;
    addMessage('user', text);
    handleCommand(text);
  };

  r.onerror = (event) => {
    statusText.textContent = "❌ Erreur micro : " + event.error;
    resetMicButton();
  };

  r.onend = () => {
    resetMicButton();
  };

  return r;
}

function resetMicButton() {
  isListening = false;
  micBtn.classList.remove('listening');
  micBtn.textContent = "🎤 Appuyer pour parler";
}

micBtn.addEventListener('click', () => {
  if (!apiKey) {
    openConfig();
    return;
  }
  if (isListening) return;
  if (!recognition) recognition = setupRecognition();
  if (recognition) {
    try { recognition.start(); } catch (e) { console.error(e); }
  }
});

// --- Traitement des commandes ---
function handleCommand(text) {
  const t = text.toLowerCase();
  statusText.textContent = "🤔 Je réfléchis...";

  if (t.includes('blague') || t.includes('rigolo')) {
    const jokes = [
      "Pourquoi les plongeurs plongent-ils toujours en arrière ? Parce que sinon ils tombent dans le bateau !",
      "Qu'est-ce qu'un crocodile qui surveille une pharmacie ? Un Lacoste garde !",
      "Pourquoi les poissons détestent le tennis ? Ils ont peur du filet !"
    ];
    reply(jokes[Math.floor(Math.random()*jokes.length)]);
    return;
  }
  if (t.includes('heure')) {
    const now = new Date();
    reply(`Il est ${now.getHours()} heures ${now.getMinutes().toString().padStart(2,'0')}`);
    return;
  }
  if (t.includes('date') || t.includes('jour sommes')) {
    const months = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
    const now = new Date();
    reply(`Nous sommes le ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`);
    return;
  }

  chatWithGroq(text);
}

async function chatWithGroq(text) {
  history.push({ role: 'user', content: text });

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          { role: 'system', content: "Tu es Astro, un assistant vocal sympa. Réponds en français, en 2-3 phrases courtes maximum." },
          ...history.slice(-10)
        ],
        temperature: 0.7,
        max_tokens: 150
      })
    });

    if (!res.ok) {
      const errText = res.status === 401 ? "Clé API invalide 😕" : `Erreur ${res.status}`;
      reply(errText);
      return;
    }

    const data = await res.json();
    const answer = data.choices[0].message.content.trim();
    history.push({ role: 'assistant', content: answer });
    reply(answer);

  } catch (e) {
    reply("Problème de connexion 😕");
  }
}

function reply(text) {
  addMessage('astro', text);
  statusText.textContent = "✅ Réponse envoyée";
  if (voiceEnabled) speak(text);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'fr-FR';
  utter.rate = 1.05;

  // Essayer de trouver une voix française masculine
  const voices = window.speechSynthesis.getVoices();
  const frVoice = voices.find(v => v.lang.startsWith('fr'));
  if (frVoice) utter.voice = frVoice;

  window.speechSynthesis.speak(utter);
}

// Message d'accueil
addMessage('astro', "Salut ! Je suis Astro 🤖 Configure ta clé API puis appuie sur le micro pour me parler !");
</script>

</body>
</html>
